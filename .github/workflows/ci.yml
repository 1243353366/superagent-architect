name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Platform tests (includes full generate + verify pipeline)
        run: python -m unittest discover -s tests -v

  acceptance:
    name: acceptance test (generate → run → detect → fix → prove → deliver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the acceptance test
        run: python scripts/acceptance.py
      - name: Upload acceptance report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: site/

  publish-report:
    name: publish live acceptance report
    if: github.ref == 'refs/heads/main'
    needs: [test, acceptance]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-report
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
